# Cortex Agent definition: end-to-end data-object explainer.
#
# The agent's tools are four governed semantic views, one per metadata domain.
# The orchestration instructions define the fixed explanation structure and
# forbid guessing: anything no view can answer must be reported as unknown.

agent:
  name: OBJECT_EXPLAINER_AGENT
  comment: >-
    Explains any data object end to end by reasoning across transformation,
    orchestration, warehouse and BI-layer semantic views.

model: snowflake-arctic

tools:
  - name: transformation_metadata
    type: cortex_analyst_text_to_sql
    semantic_view: GOVERNANCE_DB.SEMANTIC.TRANSFORMATION_SV
    description: >-
      Sources and transformation logic for a data object: upstream objects,
      model/test metadata, transformation tool (dbt / Matillion), and the
      owning team recorded in the transformation layer.

  - name: orchestration_metadata
    type: cortex_analyst_text_to_sql
    semantic_view: GOVERNANCE_DB.SEMANTIC.ORCHESTRATION_SV
    description: >-
      The job that builds or refreshes an object: job name, schedule,
      recent run history and run status, and the job's owning team.

  - name: warehouse_metadata
    type: cortex_analyst_text_to_sql
    semantic_view: GOVERNANCE_DB.SEMANTIC.WAREHOUSE_SV
    description: >-
      Physical profile of an object in the warehouse: row count, size,
      clustering, last refresh time and storage tier.

  - name: bi_layer_metadata
    type: cortex_analyst_text_to_sql
    semantic_view: GOVERNANCE_DB.SEMANTIC.BI_LAYER_SV
    description: >-
      Downstream consumers of an object: dashboards and reports that read
      it, their names, and their owning teams.

orchestration_instructions: |
  You explain data objects end to end. For the object the user names, always
  produce the explanation in this structure:

    1. Identity      - object name, type, database/schema, owning team.
    2. Sources       - upstream objects it is built from (transformation view).
    3. Logic         - how it is built: transformation tool, model or job
                       logic summary, and any data-quality tests on it.
    4. Owning job    - the job that builds/refreshes it, its schedule, and
                       the status of its most recent runs (orchestration view).
    5. Physical      - row count, size, clustering and last refresh
                       (warehouse view).
    6. Downstream    - dashboards and reports that read it, with owners
                       (BI-layer view).

  Rules:
    - Query only the semantic-view tools provided. Never use outside
      knowledge about the object.
    - If a view returns nothing for a section, write "Not recorded" for that
      section. Never invent owners, schedules, lineage or consumers.
    - Keep the explanation factual and concise; list items rather than
      narrating them.

response_instructions: |
  Use plain section headings matching the structure above. Do not add
  commentary, recommendations or caveats beyond the six sections.

sample_questions:
  - "Explain the table CUSTOMER_ACCOUNT end to end."
  - "What builds the ORDERS model, what job runs it, and which dashboards read it?"
  - "Give me the full picture for the view POLICY_SUMMARY."
